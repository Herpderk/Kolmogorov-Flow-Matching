[project]
name = "kolmogorov-flow-matching"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "h5py>=3.16.0",
    "huggingface-hub>=1.11.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.1",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "torchdiffeq>=0.2.5",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[tool.uv]
package = true

[tool.uv.sources]
kolmogorov-flow-matching = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "kolmogorov-flow-matching",
]

[tool.setuptools.packages.find]
include = ["kolmogorov_flow_matching*"]
